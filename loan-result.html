<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loan Application Summary | NYOTA Loans</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#4f46e5;--g:#059669;--ink:#17233b;--muted:#64748b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0%,#d8f8ee,transparent 40%),linear-gradient(135deg,#eef2ff,#dbeafe);font-family:'DM Sans',sans-serif;color:var(--ink);display:grid;place-items:center;padding:20px}
.card{width:min(100%,480px);background:#fff;border-radius:24px;padding:32px 26px;box-shadow:0 22px 60px #4f46e522;text-align:center}
.brand{font:800 25px Sora,sans-serif;color:var(--p)}.brand span{color:var(--g)}
.check{width:72px;height:72px;border-radius:50%;background:#dcfce7;color:var(--g);display:grid;place-items:center;margin:24px auto 14px;font-size:36px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--g);text-transform:uppercase}
h1{font:700 23px Sora,sans-serif;margin:9px 0}p{color:var(--muted);line-height:1.6;font-size:14px}
.limit{margin:24px 0;padding:22px;border-radius:18px;background:linear-gradient(120deg,#4f46e5,#6366f1);color:white;box-shadow:0 10px 25px #4f46e533}
.limit small{display:block;opacity:.88}.limit strong{display:block;font:800 34px Sora,sans-serif;margin:8px}
button{width:100%;border:0;border-radius:12px;background:linear-gradient(110deg,var(--p),#6366f1);padding:16px;color:#fff;font:700 15px 'DM Sans',sans-serif;cursor:pointer}
.note{font-size:12px;margin:14px 0 0}
</style>
</head>
<body>
<main class="card">
  <div class="brand">NYOTA <span>Loans</span></div>
  <div class="check">✓</div>
  <div class="eyebrow">Application summary</div>
  <h1>Welcome<span id="name"></span>!</h1>
  <p>Your eligibility information has been saved. Explore the next step in your loan application.</p>
  <div class="limit">
    <small>Potential loan limit</small>
    <strong>KES 25,000</strong>
    <small>Subject to eligibility assessment and approval</small>
  </div>
  <button id="next" type="button">Get a Higher Loan</button>
  <p class="note">Loan approval and the amount offered are subject to further assessment.</p>
</main>
<script>
let user=null;
try { user=JSON.parse(localStorage.getItem('nyota_user')||'null'); } catch(e) {}
if (!user || localStorage.getItem('nyota_logged_in')!=='true') {
  location.replace('signup.html');
} else {
  const firstName=String(user.fullName||'').trim().split(/\s+/)[0];
  if(firstName) document.getElementById('name').textContent=', '+firstName;
}
document.getElementById('next').addEventListener('click',()=>location.assign('savings-plan.html'));
</script>
</body>
</html>
